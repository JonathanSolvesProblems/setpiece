<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Setpiece, nothing on this mark</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/page.css" />
    <style>
      .lost { max-width: 1240px; margin: 0 auto; padding: calc(var(--unit) * 10) calc(var(--unit) * 8) calc(var(--unit) * 16); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: calc(var(--unit) * 8); align-items: center; }
      .lost h1 { grid-column: auto; width: auto; max-width: 11ch; margin-bottom: calc(var(--unit) * 5); }
      .lost img { display: block; width: min(100%, 440px); height: auto; justify-self: end; }
      .lost p { max-width: 42ch; }
      @media (max-width: 900px) { .lost { grid-template-columns: 1fr; } .lost img { justify-self: start; width: min(100%, 320px); } }
      @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .lost img { content: url("/art/anchor-paper.webp"); } }
    </style>
  </head>
  <body>
    <svg class="haze" aria-hidden="true" focusable="false">
      <filter id="chalk"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23" /><feColorMatrix type="saturate" values="0" /></filter>
      <rect width="100%" height="100%" filter="url(#chalk)" />
    </svg>
    <header class="top">
      <a class="wordmark" href="/" aria-label="Setpiece, home"><img src="/wordmark.svg" alt="" width="301" height="100" /></a>
    </header>
    <main class="lost">
      <div>
        <h1>Nothing on this mark</h1>
        <div class="stripe" aria-hidden="true" style="width: 60%; margin: 0 0 24px"></div>
        <p class="lede">There is no page at this address. The stage is on the front page, and the headset opens it from the same link.</p>
        <p><a class="primary" href="/" style="display: inline-block; text-decoration: none">Back to the stage</a></p>
      </div>
      <img src="/art/eyeline.webp" alt="Chalk drawing of a tennis ball on a tall stand beside a film camera and a clapperboard" width="822" height="870" />
    </main>
    <footer class="foot">
      <p>More of what I build at <a href="https://jonathansolvesproblems.com">jonathansolvesproblems.com</a>.</p>
    </footer>
  </body>
</html>
